name: 'Setup Build Environment'
description: 'Sets up .NET, Node, signtool, and initializes setup files'
inputs:
  working-directory:
    description: 'Solution directory to initialize with the checked-in sample data'
    required: false
    default: '.'
runs:
  using: 'composite'
  steps:
    - name: Setup .NET 10
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.x

    - name: Setup Node.js 24 LTS
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        check-latest: true

    - name: Add signtool.exe to path for build
      shell: pwsh
      run: |
        $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\" `
                      -Recurse -Filter signtool.exe `
                      | Where-Object { $_.FullName -match '\\x64\\' } `
                      | Sort-Object LastWriteTime -Descending `
                      | Select-Object -First 1 -ExpandProperty DirectoryName
        if (-not $signtool) {
          throw "signtool.exe (x64) was not found!"
        }
        echo "PATH=$signtool;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "Located signtool at: $signtool"

    - name: Initialize solution with sample data
      shell: pwsh
      working-directory: ${{ inputs.working-directory }}
      env:
        INITIAL_SETUP_PATH: ${{ github.workspace }}/Setup/InitialSetup
      run: |
        # Sample contexts and metadata are intentionally excluded from the template package.
        # Copy them from the checkout to build offline without a Dataverse login.
        Copy-Item -Path "$env:INITIAL_SETUP_PATH/SharedTest/MetadataGenerated" -Destination "test/Tests" -Recurse -Force
        Copy-Item -Path "$env:INITIAL_SETUP_PATH/SharedContext" -Destination "src/Shared" -Recurse -Force

        New-Item -ItemType Directory -Force "src/Dataverse/WebResources/typings" | Out-Null
        Copy-Item -Path "$env:INITIAL_SETUP_PATH/WebResourceTypings" -Destination "src/Dataverse/WebResources/typings/XRM" -Recurse -Force
        dotnet run --project Setup/PostSetup -- --skip-generation
        if ($LASTEXITCODE -ne 0) { throw 'Offline template setup failed' }
