parameters:
  - name: dataverseServiceConnection
    type: string
    default: DEV

steps:
  - task: DotNetCoreCLI@2
    displayName: 'dotnet restore'
    inputs:
      command: restore
      projects: 'templatecompanyname.slnx'

  - task: UseDotNet@2
    displayName: 'Use .Net 10'
    inputs:
      version: 10.x

  - task: PowerShell@2
    displayName: 'Add ClickOnce SignTool to PATH'
    inputs:
      targetType: 'inline'
      script: Write-Host "##vso[task.setvariable variable=PATH;]${env:PATH};`"C:\Program Files (x86)\Microsoft SDKs\ClickOnce\SignTool`";`"C:\Program Files\Microsoft SDKs\ClickOnce\SignTool`"";

  - script: '"$(FsiPath)" "$(DaxifPath)/GenerateCSharpContext.fsx" $(AuthParams)'
    displayName: 'Update C# context'

  - task: AzureCLI@2
    displayName: 'Update TypeScript form and Web API typings'
    inputs:
      azureSubscription: ${{ parameters.dataverseServiceConnection }}
      scriptType: pscore
      scriptLocation: inlineScript
      inlineScript: |
        az account show --output none
        dotnet tool restore
        dotnet xdt
      workingDirectory: '$(Build.SourcesDirectory)'
    env:
      DATAVERSE_URL: $(DataverseUrl)
      DATAVERSE_CREDENTIAL_TYPE: azcli

  - task: DotNetCoreCLI@2
    displayName: 'dotnet build'
    inputs:
      command: build
      projects: 'templatecompanyname.slnx'
      arguments: --no-restore --configuration $(BuildConfiguration) -p:PackAndSignPlugin=true

  - task: DotNetCoreCLI@2
    displayName: 'dotnet test (all in /test)'
    inputs:
      command: test
      projects: 'test/**/*.csproj'
      arguments: '--no-build --configuration $(BuildConfiguration)'

  - task: PowerShell@2
    displayName: Validate Main Bicep file
    inputs:
      targetType: inline
      script: 'az bicep build --file $(System.DefaultWorkingDirectory)/Infrastructure/main.bicep'

  - template: azure/validate-infrastructure.yaml
