parameters:
  - name: workingDirectory
    type: string
    default: $(Build.SourcesDirectory)
  - name: environment
    type: string
    default: Dev
steps:
  - template: run-daxif.yaml
    parameters:
      workingDirectory: ${{ parameters.workingDirectory }}
      scriptName: PublishAllArg.fsx
      arguments: '"/env:${{ parameters.environment }}"'
      displayName: Publish Dataverse customizations with DAXIF
